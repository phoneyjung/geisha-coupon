  position:absolute;left:0;right:0;bottom:34px;text-align:center;
  opacity:0;transition:opacity .55s ease .5s;
}
.noren.shut .shut-note{opacity:1}
.shut-note span{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-s);
  color:rgba(245,237,226,.9);letter-spacing:.4em;text-indent:.4em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.brand{text-align:center;padding:var(--s2) 0 var(--s3);position:relative;z-index:3}
.wordmark{width:min(268px,72%);display:block;margin:0 auto;border-radius:3px;
  box-shadow:0 var(--s1) 26px rgba(92,26,34,.14)}
.tagline{
  font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.3em;text-indent:.3em;color:var(--kin-d);margin-top:var(--s2);
}
.langs{display:flex;justify-content:center;gap:6px;margin-top:var(--s2)}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'IBM Plex Sans Thai',sans-serif;font-size:var(--t-xs);color:var(--sumi-2);
  border-radius:99px;cursor:pointer;transition:all .2s ease;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi)}
.langs{display:flex;justify-content:center;gap:5px;margin-top:var(--s2);flex-wrap:wrap}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  color:var(--sumi-2);font-family:inherit;font-size:var(--t-xs);cursor:pointer;
  border-radius:2px;transition:all .22s ease;letter-spacing:.02em;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi);font-weight:600}
.divider{display:flex;align-items:center;justify-content:center;gap:var(--s2);
  margin:var(--s3) auto 0;max-width:250px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--kin),transparent);opacity:.6}
.divider svg{opacity:.85;flex-shrink:0}
.today{
  display:flex;align-items:baseline;gap:var(--s2);
  padding:0 2px var(--s2);border-bottom:1px solid var(--line-c);margin-top:var(--s4);
}
.today .d{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;line-height:1.3}
.today .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--kin-d);white-space:nowrap}
.person{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 3px;
  border-bottom:1px solid rgba(226,214,196,.72);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.who{flex:1;min-width:0}
.who .nm{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:500;line-height:1.35}
.who .nm .tag{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  color:var(--aka);font-weight:600;margin-left:4px;letter-spacing:.02em}
.who .fr{font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--sumi-2);margin-top:3px;letter-spacing:-.01em;line-height:1.6}
.who .nx{font-size:var(--t-xs);color:var(--aka);margin-top:3px;opacity:.85;font-weight:500}
.person.full .fr{color:#B9AE9E}
.person.full .nm{opacity:.6}
.atbox{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(245,237,226,.5));
  border:1px solid rgba(197,162,83,.34);border-radius:3px;
  padding:var(--s3) var(--s3) var(--s2);margin:var(--s3) 0 var(--s2);
  box-shadow:0 1px 10px rgba(92,26,34,.05);
}
.at-h{font-size:var(--t-m);font-weight:600;color:var(--sumi);letter-spacing:.01em}
.at-s{font-size:var(--t-xs);color:var(--sumi-2);opacity:.8;margin-top:2px;line-height:1.6}
.at-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:var(--s2)}
.at-c{flex:1 1 auto;min-width:72px;padding:8px 6px;border:1px solid rgba(197,162,83,.42);
  background:rgba(255,255,255,.8);color:var(--sumi);border-radius:2px;
  font-family:inherit;font-size:var(--t-xs);cursor:pointer;transition:.2s}
.at-c:hover,.at-c:focus-visible{background:var(--gold);color:#fff;border-color:var(--gold)}
.at-c-all{border-style:dashed;color:var(--sumi-2)}
.at-c-all.on{background:var(--sumi);color:var(--washi);border-color:var(--sumi);border-style:solid}
.at-row{display:flex;gap:5px;margin-top:6px}
.at-row input{flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(197,162,83,.42);
  border-radius:2px;background:#fff;color:var(--sumi);text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:var(--t-m);letter-spacing:.06em}
.at-row input:focus{outline:none;border-color:var(--gold)}
.at-go{padding:9px 18px;border:none;border-radius:2px;background:var(--sumi);color:var(--washi);
  font-family:inherit;font-size:var(--t-s);cursor:pointer;transition:.2s}
.at-go:hover{background:var(--aka)}
.at-on{margin-top:8px;padding-top:8px;border-top:1px solid rgba(197,162,83,.24);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:var(--t-s);font-weight:600;color:var(--aka)}
.at-clr{padding:5px 12px;border:1px solid rgba(92,26,34,.28);background:transparent;
  color:var(--sumi-2);border-radius:2px;font-family:inherit;font-size:var(--t-xs);cursor:pointer}
.at-clr:hover{background:rgba(92,26,34,.06)}
.notebox{
  margin-top:var(--s3);padding:var(--s2) var(--s3);
  background:var(--washi-hi);border:1px solid var(--line-c);border-left:2.5px solid var(--kin);
}
.nb-row{font-size:var(--t-s);color:var(--sumi-2);line-height:1.9}
.nb-row b{color:var(--aka);font-weight:600}
.linebox{margin-top:var(--s3)}
.lb-head{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-m);font-weight:600;
  text-align:center;margin-bottom:var(--s2);color:var(--sumi);
}
.lb-items{display:flex;flex-direction:column;gap:var(--s1)}
.lb-item{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);text-decoration:none;
  background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;
  transition:border-color .25s ease,transform .2s ease;
}
.lb-item:hover,.lb-item:focus-visible{border-color:var(--kin);transform:translateY(-1px)}
.lb-ic{font-size:19px;flex-shrink:0;width:30px;text-align:center}
.lb-tx{flex:1;min-width:0;line-height:1.5}
.lb-tx b{display:block;font-size:var(--t-s);font-weight:600;color:var(--sumi)}
.lb-tx small{display:block;font-size:var(--t-xs);color:var(--sumi-2);margin-top:1px}
.lb-go{color:var(--kin-d);font-size:var(--t-l);flex-shrink:0;line-height:1}
.topdiv{
  text-align:center;padding:var(--s3) 0 var(--s2);
  font-size:var(--t-s);letter-spacing:.06em;color:var(--kin-d);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
.ask{
  flex-shrink:0;padding:var(--s1) var(--s3);border:1px solid var(--aka);
  background:transparent;color:var(--aka);text-decoration:none;border-radius:2px;
  font-size:var(--t-s);font-weight:500;transition:all .25s ease;
}
.ask:hover,.ask:focus-visible{background:var(--aka);color:var(--washi-hi)}
.state{text-align:center;padding:var(--s5) var(--s3)}
.state .ksv{opacity:.55;margin-bottom:var(--s3)}
.state h2{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;margin-bottom:var(--s1)}
.state p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.95}
.state .clock{display:inline-block;margin-top:var(--s3);padding:var(--s1) var(--s3);
  border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  letter-spacing:.1em;color:var(--kin-d)}
.skel{height:55px;border-bottom:1px solid rgba(226,214,196,.72);
  background:linear-gradient(90deg,transparent,rgba(197,162,83,.08),transparent);
  background-size:220% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{to{background-position:-220% 0}}

  box-shadow:0 var(--s1) 28px rgba(42,37,32,.32);
  transition:transform .25s ease,box-shadow .25s ease;
}
.fab:hover,.fab:focus-visible{transform:translateX(-50%) translateY(-2px);
  box-shadow:0 var(--s2) 34px rgba(42,37,32,.4)}
.fab .ic{width:26px;height:26px;flex-shrink:0;border-radius:6px;
  box-shadow:0 0 0 rgba(6,199,85,.6);animation:lineGlow 2.8s ease-in-out infinite}
@keyframes lineGlow{
  0%,68%,100%{box-shadow:0 0 0 0 rgba(6,199,85,.55)}
  82%{box-shadow:0 0 0 7px rgba(6,199,85,0)}
}
.fab::after{
  content:'';position:absolute;top:0;bottom:0;width:52px;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.34),transparent);
  transform:skewX(-18deg);animation:sweep 4.2s ease-in-out infinite;
}
@keyframes sweep{
  0%{left:-70px}
  38%,100%{left:118%}
}
.foot{text-align:center;padding:var(--s4) var(--s2) var(--s1);
  border-top:1px solid var(--line-c);margin-top:var(--s4)}
.foot p{font-size:var(--t-s);color:var(--sumi-2);line-height:2}
.foot .addr{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.08em;opacity:.72;margin-top:2px}
.foot .note{margin-top:var(--s2);opacity:.62;font-size:var(--t-xs)}
.petal{position:fixed;top:-24px;pointer-events:none;z-index:0;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}
  14%{opacity:.42}86%{opacity:.32}
  100%{opacity:0;transform:translateY(104dvh) translateX(52px) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .nrn.l{transform:translateX(-104%)}.nrn.r{transform:translateX(104%)}
  .noren.shut .nrn.l,.noren.shut .nrn.r{transform:translateX(0)}
  .petal{display:none}
}
:focus-visible{outline:2px solid var(--kin);outline-offset:3px}
@media(max-width:380px){
  :root{--t-l:calc(19px*var(--fz));--t-xl:calc(29px*var(--fz))}
  .stage{height:172px}
  .ask{padding:7px var(--s2)}
}
.tabs{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding-top:env(safe-area-inset-top,0px);background:rgba(251,246,239,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-c);box-shadow:0 2px 14px rgba(92,26,34,.06)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px 6px;
  text-decoration:none;color:var(--sumi-2);font-size:var(--t-xs);letter-spacing:.02em;border-bottom:2px solid transparent;max-width:none}
.tabs a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--aka);border-bottom-color:var(--aka);font-weight:600}
@media (min-width:640px){.tabs{grid-template-columns:repeat(4,136px);justify-content:center}}
.tabs-in{max-width:560px;margin:0 auto;display:contents}
.view[hidden]{display:none!important}
.pg{max-width:560px;margin:0 auto;padding:var(--s3) var(--s3) 128px;position:relative;z-index:1}
.pg-h{text-align:center;padding:var(--s3) 0 var(--s2)}
.pg-h img{width:min(230px,64%);display:block;margin:0 auto;border-radius:3px;box-shadow:0 var(--s1) 26px rgba(92,26,34,.14)}
.pg-h .sub{font-family:'Noto Serif Thai',serif;font-size:var(--t-m);color:var(--sumi);margin-top:var(--s2)}
.pg-h .pill{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s1);padding:4px 12px;border:1px solid var(--line-c);background:var(--washi-hi);border-radius:99px;font-size:var(--t-xs);color:var(--sumi-2)}
.pg-h .pill i{width:7px;height:7px;border-radius:50%;background:#B9AE9E}
.pg-h .pill.op i{background:#2F9A5E}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1);margin-top:var(--s3)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:var(--s3) var(--s2) var(--s2);background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;text-decoration:none;color:var(--sumi);transition:border-color .25s ease,transform .2s ease;min-height:104px}
.tile:hover,.tile:focus-visible{border-color:var(--kin);transform:translateY(-1px)}
.tile svg{width:28px;height:28px;stroke:var(--aka);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:'Noto Serif Thai',serif;font-size:var(--t-m);font-weight:600;line-height:1.35}
.tile small{font-size:var(--t-xs);color:var(--sumi-2);line-height:1.5}
.tile.line{background:#06C755;border-color:#06C755;color:#fff}.tile.line svg{stroke:#fff}.tile.line small{color:rgba(255,255,255,.9)}
.hh{display:flex;align-items:center;gap:var(--s2);padding:0 2px var(--s2);border-bottom:1px solid var(--line-c);margin-top:var(--s4)}
.hh:first-child{margin-top:0}
.hh h2{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;line-height:1.3}
.hh .ic{font-size:calc(18px*var(--fz))}
.news-i{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2);margin-top:var(--s1);background:var(--washi-hi);border:1px solid var(--line-c);border-left:2.5px solid var(--aka);border-radius:2px}
.news-i .nd{flex:none;font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);color:var(--kin-d);padding-top:2px;min-width:44px}
.news-i b{display:block;font-size:var(--t-s);font-weight:600;color:var(--sumi);line-height:1.6}
.news-i small{display:block;font-size:var(--t-xs);color:var(--sumi-2);line-height:1.7}
.tools{display:flex;justify-content:center;gap:5px;margin-top:var(--s3);flex-wrap:wrap}
.tl{padding:6px 13px;border:1px solid var(--line-c);background:var(--washi-hi);color:var(--sumi-2);font-family:inherit;font-size:var(--t-xs);cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:5px}
.tl[aria-pressed="true"]{background:var(--kin);border-color:var(--kin);color:#fff;font-weight:600}
.ev{display:flex;gap:var(--s2);align-items:stretch;margin-top:var(--s2);background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .25s ease,transform .2s ease}
a.ev:hover,a.ev:focus-visible{border-color:var(--kin);transform:translateY(-1px)}
.ev .pic{flex:none;width:36%;min-height:104px;background:#1B1F3B center/cover no-repeat}
.ev .pic.pl{background:linear-gradient(135deg,#F3E4E6,#EDE2D0);display:grid;place-items:center;font-size:calc(28px*var(--fz))}
.ev .tx{flex:1;min-width:0;padding:var(--s2) var(--s2) var(--s2) 0}
.ev .bd{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);color:var(--aka);letter-spacing:.04em}
.ev h3{font-family:'Noto Serif Thai',serif;font-size:var(--t-m);font-weight:600;line-height:1.4;margin-top:2px}
.ev p{font-size:var(--t-xs);color:var(--sumi-2);line-height:1.7;margin-top:2px}
.ev .go{display:inline-block;margin-top:4px;font-size:var(--t-xs);color:var(--kin-d);font-weight:600}
.ev.soon{opacity:.7}
.vi{display:flex;gap:var(--s2);align-items:center;padding:var(--s2);margin-top:var(--s1);background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px}
.vi .ic{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(197,162,83,.45);border-radius:2px;font-size:calc(17px*var(--fz))}
.vi .tx{flex:1;min-width:0}
.vi b{display:block;font-size:var(--t-s);font-weight:600;line-height:1.5}
.vi .tx>span{display:block;font-size:var(--t-xs);color:var(--sumi-2);line-height:1.7}
.vi .open{color:#2F7A4F;font-weight:600}.vi .closed{color:var(--aka);font-weight:600}
.vbtn{flex:none;padding:var(--s1) var(--s2);border:1px solid var(--aka);color:var(--aka);text-decoration:none;border-radius:2px;font-size:var(--t-xs);font-weight:600;white-space:nowrap}
.vbtn:hover,.vbtn:focus-visible{background:var(--aka);color:var(--washi-hi)}
.flw{display:flex;gap:var(--s1);margin-top:var(--s1)}
.flw a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:var(--s2);background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;text-decoration:none;color:var(--sumi);font-size:var(--t-s);font-weight:600}
.flw a:hover{border-color:var(--kin)}
.flw .dotg{width:10px;height:10px;border-radius:50%;background:#06C755}.flw .dott{width:10px;height:10px;border-radius:50%;background:#229ED9}
.pg-foot{text-align:center;margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line-c);font-size:var(--t-xs);color:var(--sumi-2);line-height:2}
img{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}
</style>
